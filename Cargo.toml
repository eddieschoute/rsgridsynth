[package]
name = "rsgridsynth"
version = "0.2.2"
edition = "2021"
authors = ["Shun Yamamoto", "Nobuyuki Yoshioka", "IBM"]
license = "MIT"
description = "Rust-based synthesizer that decomposes single-qubit Z-axis rotations into Clifford+T gate sequences"
repository = "https://github.com/qiskit-community/rsgridsynth"
homepage = "https://github.com/qiskit-community/rsgridsynth"
readme = "README.md"
keywords = ["quantum", "benchmarking"]
categories = ["algorithms", "science"]
rust-version = "1.87"

[[bin]]
name = "rsgridsynth"
required-features = ["cli"]
path = "src/main.rs"

[lib]
name = "rsgridsynth"
path = "src/lib.rs"

[dependencies]
nalgebra = { version = "0.35", features = ["macros"] }
once_cell = "1.21"
num-traits = "0.2"
rand = "0.9"
clap = { optional = true, version = "4.6.4", features = ["derive"] }
num = "0.4"
dashu = "0.4.2"
dashu-int = "0.4.1"
dashu-float = { version = "0.4.3", features = ["num-traits_v02"]}
dashu-base = "0.4.1"
log = "0.4"
env_logger = "0.11"

[features]
cli = ["dep:clap"]

[dev-dependencies]
serial_test = "3"
ntest = "0.8.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
